name: COBRIA CI

on:
  push:
  pull_request:

jobs:
  replication:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: replication/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node src/cli.mjs verificar --adaptador lokijs --tamano 30 --salida "$RUNNER_TEMP/cobria"
      - run: npm run sbom
      - run: node -e "const s=require('./SBOM.cdx.json'); if(s.bomFormat!=='CycloneDX'||!s.components.length) process.exit(1)"

  package-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 replication/scripts/build-release-manifest.py
        working-directory: replication

  infrastructure-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f replication/infrastructure/docker-compose.core12.yml config
