{
  "manifestId": "cobria-nodes-reference",
  "version": "1.0.0",
  "status": "reference",
  "owner": "COBRIA Data",
  "dictionary": "specification/phase-3/data-dictionary.yaml",
  "sourceRequirement": "ECO-RF-004",
  "description": "Topología neutral para observaciones ambientales; nX, snX y lX son alias físicos, no nombres de dominio.",
  "nodes": [
    {
      "id": "NODE-OBS-CANONICAL",
      "logicalName": "ObservacionesCanonicas",
      "physicalPath": "n8/{ambitoId}/{observacionId}",
      "kind": "canonical",
      "need": "Conservar la autoridad de cada observación con identidad, ámbito y revisión.",
      "owner": "Equipo responsable de datos del ámbito",
      "writeAuthority": "RepositorioObservaciones",
      "identity": ["ambitoId", "observacionId"],
      "scope": "ambitoId",
      "cardinality": "muchas observaciones por ámbito; identidad única dentro del ámbito",
      "growth": "crecimiento continuo; paginación obligatoria",
      "lifecycle": "crear → revisar → verificar/descartar → retener/eliminar por política",
      "atomicity": "una observación y su revisión; salidas externas mediante outbox",
      "consistency": "rechazo de revisión obsoleta",
      "queries": ["obtener por identidad y ámbito", "listar por ámbito y tiempo con cursor"],
      "indexes": ["unique(ambitoId, observacionId)", "(ambitoId, ocurrioEn desc)"],
      "retention": "política del ámbito y finalidad; eliminación propagada a derivados",
      "security": "autorizar ámbito antes de formar ruta o consulta",
      "rebuild": null,
      "tests": ["identidad requerida", "ámbito extranjero rechazado", "revisión obsoleta rechazada"],
      "costs": ["almacenamiento canónico", "índices de identidad y tiempo"]
    },
    {
      "id": "NODE-OBS-DETAIL",
      "logicalName": "DetalleUbicacion",
      "physicalPath": "n8/{ambitoId}/{observacionId}/sn1",
      "kind": "embedded",
      "need": "Conservar un valor pequeño que solo existe con la observación.",
      "owner": "Dominio de observaciones",
      "writeAuthority": "RepositorioObservaciones",
      "identity": ["parent:observacionId"],
      "scope": "heredado y verificado contra ambitoId del padre",
      "cardinality": "cero o uno por observación",
      "growth": "acotado; tamaño máximo declarado",
      "lifecycle": "idéntico al padre",
      "atomicity": "se escribe con la observación",
      "consistency": "fuerte dentro de la frontera documental disponible",
      "queries": ["leer junto con la observación"],
      "indexes": [],
      "retention": "idéntica al padre",
      "security": "no amplía permisos del padre",
      "rebuild": null,
      "tests": ["no sobrepasa tamaño máximo", "no existe sin padre", "ámbito coincide con padre"],
      "costs": ["aumenta tamaño y frecuencia de reescritura del documento"]
    },
    {
      "id": "NODE-CATALOG-SPECIES",
      "logicalName": "CatalogoEspecies",
      "physicalPath": "n9/{catalogoVersion}/{especieCodigo}",
      "kind": "reference",
      "need": "Interpretar códigos históricos usando una edición gobernada.",
      "owner": "Responsable del catálogo de especies",
      "writeAuthority": "PublicadorCatalogo",
      "identity": ["catalogoVersion", "especieCodigo"],
      "scope": "global o por jurisdicción declarada; nunca inferido",
      "cardinality": "muchos códigos por versión; versiones inmutables publicadas",
      "growth": "bajo y versionado",
      "lifecycle": "borrador → validado → publicado → sustituido → archivado",
      "atomicity": "publicación por versión completa o alias estable",
      "consistency": "lectura por versión exacta",
      "queries": ["resolver código por versión", "listar edición para validación"],
      "indexes": ["unique(catalogoVersion, especieCodigo)"],
      "retention": "versiones referenciadas se conservan mientras existan datos dependientes",
      "security": "escritura restringida; lectura según sensibilidad del catálogo",
      "rebuild": "regenerable solo desde fuente maestra y manifiesto declarados",
      "tests": ["versión inexistente rechazada", "código desconocido aplica política", "edición publicada es inmutable"],
      "costs": ["coordinación editorial", "retención multiversión"]
    },
    {
      "id": "NODE-OUTBOX",
      "logicalName": "BandejaEventosObservacion",
      "physicalPath": "n10/{ambitoId}/{eventoId}",
      "kind": "outbox",
      "need": "Coordinar efectos cuando el motor no ofrece una transacción que abarque consumidores externos.",
      "owner": "Equipo de integración",
      "writeAuthority": "RepositorioObservaciones dentro de la misma frontera atómica",
      "identity": ["ambitoId", "eventoId"],
      "scope": "ambitoId",
      "cardinality": "varios eventos por observación",
      "growth": "continuo; compactación después de entrega y retención",
      "lifecycle": "pendiente → procesando → entregado/fallido → archivado/eliminado",
      "atomicity": "documento canónico y registro outbox se confirman juntos cuando el motor lo permite",
      "consistency": "entrega al menos una vez; consumidor idempotente",
      "queries": ["pendientes por ámbito y próximo intento", "evento por clave idempotente"],
      "indexes": ["(ambitoId, estado, proximoIntento)", "unique(ambitoId, claveIdempotencia)"],
      "retention": "ventana operativa más auditoría mínima",
      "security": "solo backend; contenido minimizado",
      "rebuild": "no se reconstruye desde la proyección; reemisión requiere regla explícita",
      "tests": ["entrega duplicada no duplica efecto", "fallo conserva evento", "otro ámbito no consume"],
      "costs": ["escritura adicional", "trabajador, reintentos y cola de fallos"]
    },
    {
      "id": "NODE-SEARCH-PROJECTION",
      "logicalName": "BusquedaObservaciones",
      "physicalPath": "n11/{versionProyeccion}/{ambitoId}/{observacionId}",
      "kind": "projection",
      "need": "Responder búsqueda de texto y filtros sin ampliar la autoridad canónica.",
      "owner": "Equipo de búsqueda",
      "writeAuthority": "ConstructorProyeccionBusqueda",
      "identity": ["versionProyeccion", "ambitoId", "observacionId"],
      "scope": "ambitoId copiado y verificado desde fuente",
      "cardinality": "a lo sumo una entrada por observación y versión",
      "growth": "proporcional a fuentes; versiones candidatas duplican temporalmente almacenamiento",
      "lifecycle": "ausente → construyendo → candidata → verificada → publicada → retirada",
      "atomicity": "construcción separada; publicación mediante versión/alias",
      "consistency": "frescura declarada y revisión de fuente",
      "queries": ["buscar texto dentro del ámbito", "filtrar por especie y estado"],
      "indexes": ["índice textual por ámbito", "(ambitoId, especieCodigo, estado)"],
      "retention": "versión activa más ventana de rollback; retirar datos eliminados",
      "security": "filtrar ámbito antes de ranking o similitud",
      "rebuild": "total desde NODE-OBS-CANONICAL y NODE-CATALOG-SPECIES con contrato versionado",
      "tests": ["R1 equivalencia y repetición", "S1 cero cruces de ámbito", "publicación fallida conserva versión activa"],
      "costs": ["amplificación de escritura", "almacenamiento temporal", "operación de reconstrucción"]
    },
    {
      "id": "NODE-ANALYTIC-SNAPSHOT",
      "logicalName": "ConjuntoAnaliticoFechado",
      "physicalPath": "n12/{datasetVersion}/{partitionId}",
      "kind": "snapshot",
      "need": "Reproducir análisis o entrenamiento con corte, transformación y partición declarados.",
      "owner": "Equipo responsable de analítica",
      "writeAuthority": "ConstructorDataset",
      "identity": ["datasetVersion", "partitionId"],
      "scope": "lista explícita de ámbitos autorizados; particiones sin fuga",
      "cardinality": "muchas filas o fragmentos por versión",
      "growth": "por ejecución; presupuesto y expiración declarados",
      "lifecycle": "propuesto → materializando → verificado → publicado → expirado/retirado",
      "atomicity": "manifiesto se publica solo al completar y verificar fragmentos",
      "consistency": "corte congelado; no se modifica en sitio",
      "queries": ["leer por versión y partición", "verificar huellas y cobertura"],
      "indexes": ["unique(datasetVersion, partitionId)", "manifiesto por versión"],
      "retention": "según finalidad, consentimiento, costo y reproducibilidad permitida",
      "security": "minimización, seudonimización y autorización antes de materializar",
      "rebuild": "desde fuentes, corte, consulta, catálogo, transformación y semilla del manifiesto",
      "tests": ["A1 manifiesto completo", "partición temporal sin fuga", "huellas coinciden", "abstención si falta evidencia"],
      "costs": ["almacenamiento por versión", "cómputo", "riesgo de retención de datos"]
    }
  ],
  "relationships": [
    {"from": "NODE-OBS-CANONICAL", "to": "NODE-OBS-DETAIL", "type": "embeds", "rule": "mismo ciclo de vida y frontera atómica"},
    {"from": "NODE-OBS-CANONICAL", "to": "NODE-CATALOG-SPECIES", "type": "references", "rule": "referencia por versión exacta; no duplicar significado mutable"},
    {"from": "NODE-OBS-CANONICAL", "to": "NODE-OUTBOX", "type": "emits", "rule": "misma confirmación o reconciliación explícita"},
    {"from": "NODE-OBS-CANONICAL", "to": "NODE-SEARCH-PROJECTION", "type": "projects", "rule": "derivado sin autoridad y reconstruible"},
    {"from": "NODE-OBS-CANONICAL", "to": "NODE-ANALYTIC-SNAPSHOT", "type": "materializes", "rule": "corte, procedencia y partición declarados"}
  ]
}
