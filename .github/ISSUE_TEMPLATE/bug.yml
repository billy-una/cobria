name: Defecto reproducible
description: Reportar un comportamiento incorrecto de COBRIA
title: "[Defecto] "
labels: ["defecto"]
body:
  - type: markdown
    attributes:
      value: "No incluya secretos ni datos personales. COBRIA es una propuesta independiente."
  - type: input
    id: version
    attributes:
      label: Versión o commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema observable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos mínimos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado obtenido
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y ambiente

