{
  "dictionaryId": "cobria-data-reference",
  "version": "1.0.0",
  "status": "reference",
  "owner": "COBRIA Data",
  "source": "specification/phase-2/REQUISITOS-ECOSISTEMA.md#eco-rf-004--definir-datos-y-contratos",
  "description": "Caso neutral de observaciones ambientales para enseñar el diccionario COBRIA.",
  "entities": [
    {
      "id": "ENT-OBSERVACION",
      "conceptualName": "Observación ambiental",
      "logicalName": "Observacion",
      "physicalNode": "n8",
      "authority": "canonical",
      "scopeRule": "Toda identidad y operación incluye ambitoId.",
      "retention": "Según finalidad y política del ámbito; no se fija un plazo universal.",
      "owner": "Equipo responsable de datos del ámbito",
      "schemaVersion": 3,
      "attributes": [
        {
          "id": "DAT-OBS-ID",
          "conceptualName": "Identidad de observación",
          "logicalName": "observacionId",
          "physicalKey": "a",
          "type": "string",
          "required": true,
          "format": "^[a-z0-9][a-z0-9-]{2,63}$",
          "unit": null,
          "scope": "global dentro del ámbito",
          "timeMeaning": null,
          "provenance": "asignada al registrar; no deriva de un nombre mutable",
          "sensitivity": "internal",
          "retention": "igual al documento",
          "introducedIn": 1,
          "owner": "Dominio de observaciones",
          "consumers": ["RepositorioObservaciones", "ProyeccionBusqueda"],
          "indexes": ["unique(ambitoId, observacionId)"],
          "example": "observacion-0042",
          "rules": ["inmutable", "no reutilizable"]
        },
        {
          "id": "DAT-OBS-AMBITO",
          "conceptualName": "Ámbito autorizado",
          "logicalName": "ambitoId",
          "physicalKey": "b",
          "type": "string",
          "required": true,
          "format": "^[a-z0-9][a-z0-9-]{2,63}$",
          "unit": null,
          "scope": "partición de seguridad",
          "timeMeaning": null,
          "provenance": "contexto autorizado de la operación",
          "sensitivity": "restricted",
          "retention": "igual al documento y registros de auditoría aplicables",
          "introducedIn": 1,
          "owner": "Responsable de seguridad y datos",
          "consumers": ["AutorizadorAmbito", "RepositorioObservaciones"],
          "indexes": ["prefix/partition", "unique(ambitoId, observacionId)"],
          "example": "bosque-sur",
          "rules": ["obligatorio antes de leer o escribir", "no inferir desde la interfaz"]
        },
        {
          "id": "DAT-OBS-REVISION",
          "conceptualName": "Revisión lógica",
          "logicalName": "revision",
          "physicalKey": "c",
          "type": "integer",
          "required": true,
          "format": "positive-integer",
          "unit": "revision",
          "scope": "por observacionId y ambitoId",
          "timeMeaning": "orden lógico, no instante",
          "provenance": "repositorio canónico",
          "sensitivity": "internal",
          "retention": "igual al documento",
          "introducedIn": 1,
          "owner": "RepositorioObservaciones",
          "consumers": ["ControlConcurrencia", "ProyeccionBusqueda"],
          "indexes": [],
          "example": 3,
          "rules": ["monotónica", "rechazar revisiones obsoletas"]
        },
        {
          "id": "DAT-OBS-ESQUEMA",
          "conceptualName": "Versión del esquema documental",
          "logicalName": "versionEsquema",
          "physicalKey": "d",
          "type": "integer",
          "required": true,
          "format": "positive-integer",
          "unit": "version",
          "scope": "tipo documental",
          "timeMeaning": null,
          "provenance": "contrato de persistencia",
          "sensitivity": "public-metadata",
          "retention": "permanente con el documento",
          "introducedIn": 1,
          "owner": "COBRIA Data",
          "consumers": ["DaterObservacion", "MigradorObservacion"],
          "indexes": [],
          "example": 3,
          "rules": ["migración explícita", "no confundir con revisión"]
        },
        {
          "id": "DAT-OBS-TIEMPO-EVENTO",
          "conceptualName": "Instante en que ocurrió la observación",
          "logicalName": "ocurrioEn",
          "physicalKey": "e",
          "type": "string",
          "required": true,
          "format": "date-time RFC 3339 con zona",
          "unit": "instant",
          "scope": "hecho observado",
          "timeMeaning": "tiempo válido",
          "provenance": "persona o dispositivo que registra",
          "sensitivity": "restricted",
          "retention": "según finalidad científica y privacidad",
          "introducedIn": 1,
          "owner": "Dominio de observaciones",
          "consumers": ["AnaliticaTemporal", "ProyeccionBusqueda"],
          "indexes": ["(ambitoId, ocurrioEn desc)"],
          "example": "2026-08-24T14:10:00-06:00",
          "rules": ["conservar zona u offset", "no sustituir con hora de escritura"]
        },
        {
          "id": "DAT-OBS-ESPECIE",
          "conceptualName": "Especie observada",
          "logicalName": "especieCodigo",
          "physicalKey": "f",
          "type": "string",
          "required": true,
          "format": "catalog-code",
          "unit": null,
          "scope": "catálogo declarado",
          "timeMeaning": "interpretado según catalogoVersion",
          "provenance": "clasificación registrada",
          "sensitivity": "restricted",
          "retention": "igual al documento",
          "introducedIn": 1,
          "owner": "Responsable del catálogo de especies",
          "consumers": ["CatalogoEspecies", "AnaliticaEspecies"],
          "indexes": ["(ambitoId, especieCodigo)"],
          "example": "AVE-003",
          "rules": ["debe existir en la versión declarada", "desconocidos van a cuarentena"]
        },
        {
          "id": "DAT-OBS-CATALOGO",
          "conceptualName": "Versión del catálogo usada para interpretar la especie",
          "logicalName": "catalogoVersion",
          "physicalKey": "g",
          "type": "string",
          "required": true,
          "format": "semantic-or-date-version",
          "unit": null,
          "scope": "catálogo de especies",
          "timeMeaning": "edición efectiva al validar",
          "provenance": "CatalogoEspecies",
          "sensitivity": "public-metadata",
          "retention": "permanente para interpretación histórica",
          "introducedIn": 2,
          "owner": "Responsable del catálogo de especies",
          "consumers": ["DaterObservacion", "Reconstruccion"],
          "indexes": [],
          "example": "2026.1",
          "rules": ["inmutable para una revisión publicada"]
        },
        {
          "id": "DAT-OBS-ESTADO",
          "conceptualName": "Estado de verificación",
          "logicalName": "estado",
          "physicalKey": "h",
          "type": "string",
          "required": true,
          "format": "enum",
          "unit": null,
          "scope": "dominio de observaciones",
          "timeMeaning": "estado de la revisión actual",
          "provenance": "caso de uso de verificación",
          "sensitivity": "internal",
          "retention": "igual al documento y auditoría aplicable",
          "introducedIn": 1,
          "owner": "Dominio de observaciones",
          "consumers": ["FlujoVerificacion", "ProyeccionBusqueda"],
          "indexes": ["(ambitoId, estado, ocurrioEn desc)"],
          "example": "verificada",
          "rules": ["valor de CAT-ESTADO-OBSERVACION"]
        },
        {
          "id": "DAT-OBS-PROCEDENCIA",
          "conceptualName": "Procedencia de la revisión",
          "logicalName": "procedencia",
          "physicalKey": "i",
          "type": "object",
          "required": true,
          "format": "source-id + recorded-at + method",
          "unit": null,
          "scope": "revisión documental",
          "timeMeaning": "tiempo conocido",
          "provenance": "frontera de entrada",
          "sensitivity": "restricted",
          "retention": "igual al documento o registro seudonimizado",
          "introducedIn": 3,
          "owner": "Gobernanza de datos",
          "consumers": ["Auditoria", "AnaliticaReproducible"],
          "indexes": [],
          "example": {"fuenteId": "sensor-17", "registradoEn": "2026-08-24T14:12:00-06:00", "metodo": "manual"},
          "rules": ["no incluir secretos", "minimizar identificadores personales"]
        }
      ]
    }
  ],
  "catalogs": [
    {
      "id": "CAT-ESTADO-OBSERVACION",
      "version": "1.0.0",
      "owner": "Dominio de observaciones",
      "unknownPolicy": "reject",
      "values": [
        {"code": "pendiente", "meaning": "aún no verificada", "validFrom": "2026-01-01"},
        {"code": "verificada", "meaning": "revisión aceptada", "validFrom": "2026-01-01"},
        {"code": "descartada", "meaning": "no apta; conservar motivo separado", "validFrom": "2026-01-01"}
      ]
    }
  ]
}
